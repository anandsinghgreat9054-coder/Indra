<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INDRA AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #131314;
            color: #e3e3e3;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 500;
            background: linear-gradient(45deg, #4285f4, #9b51e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px max(5%, 20px);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.98rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .user-msg {
            background-color: #2b2a33;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-msg {
            background-color: transparent;
            align-self: flex-start;
            padding-left: 0;
        }

        .ai-source {
            display: block;
            font-size: 11px;
            opacity: 0.5;
            margin-top: 8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-area {
            padding: 20px max(5%, 20px);
            background-color: #131314;
        }

        .input-wrapper {
            background-color: #1e1f20;
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 10px 20px;
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid #3c4043;
        }

        .model-select {
            background: transparent;
            color: #c4c7c5;
            border: none;
            outline: none;
            font-size: 0.88rem;
            cursor: pointer;
            padding-right: 10px;
            border-right: 1px solid #3c4043;
            margin-right: 10px;
        }

        .model-select option {
            background-color: #1e1f20;
            color: #e3e3e3;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e3e3e3;
            resize: none;
            height: 24px;
            font-size: 0.98rem;
        }

        .send-btn {
            background: transparent;
            border: none;
            color: #a8c7fa;
            cursor: pointer;
            font-size: 1.3rem;
            padding-left: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>INDRA AI</h1>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-msg">
            Hi, main Indra hoon. Sabhi core networks patched hain. Poochho kya poochna hai?
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <select class="model-select" id="modelSelector">
                <option value="">Indra Mode (Auto)</option>
                <option value="chatgpt">ChatGPT</option>
                <option value="claude">Claude</option>
                <option value="gemini">Gemini</option>
                <option value="deepseek">DeepSeek</option>
                <option value="perplexity">Perplexity</option>
                <option value="grok">Grok</option>
            </select>

            <textarea id="userInput" placeholder="Ask Indra..."></textarea>
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const modelSelector = document.getElementById('modelSelector');

        sendBtn.addEventListener('click', async () => {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user-msg');
            userInput.value = '';

            const selectedModel = modelSelector.value;
            
            // Temporary Loader bubble
            const loaderId = appendMessage("Indra is processing...", 'ai-msg', 'System');

            try {
                const response = await fetch('/api/chat', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text, specificAI: selectedModel })
                });
                
                const data = await response.json();
                
                // Remove loader and put actual text
                document.getElementById(loaderId).remove();
                appendMessage(data.answer, 'ai-msg', data.source);
                
            } catch (err) {
                document.getElementById(loaderId).remove();
                appendMessage("Network response fail ho gaya bhai.", 'ai-msg', 'System Error');
            }
        });

        function appendMessage(text, className, source = '') {
            const id = 'msg-' + Math.random().toString(36).substr(2, 9);
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.id = id;
            msgDiv.innerText = text;

            if (source) {
                const sourceBadge = document.createElement('span');
                sourceBadge.className = 'ai-source';
                sourceBadge.innerText = source;
                msgDiv.appendChild(sourceBadge);
            }

            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
