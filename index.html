<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Video Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #1f1f1f;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #ff0000; /* YouTube Red */
        }

        p {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .input-box {
            width: 100%;
            padding: 14px 20px;
            background: #2f2f2f;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            margin-bottom: 15px;
            transition: border 0.3s;
        }

        .input-box:focus {
            border-color: #ff0000;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #ff0000;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #cc0000;
        }

        /* Result Area */
        .result-card {
            margin-top: 25px;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 10px;
            display: none;
        }

        .video-title {
            font-size: 1rem;
            margin-bottom: 15px;
            font-weight: 500;
            text-align: left;
        }

        .download-btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: #2ea44f;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .download-btn:hover {
            background: #2c974b;
        }

        .status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #ffcc00;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>YT Downloader</h1>
        <p>Paste YouTube video link below to get direct download file</p>

        <input type="text" id="videoUrl" class="input-box" placeholder="https://www.youtube.com/watch?v=...">
        <button id="fetchBtn" class="btn">Get Download Link</button>

        <div id="statusText" class="status">Processing your video... Please wait...</div>

        <div id="resultCard" class="result-card">
            <div id="videoTitle" class="video-title">Video Title Here</div>
            <a href="#" id="downloadLink" class="download-btn" target="_blank" download>⬇️ Download MP4 Video</a>
        </div>
    </div>

    <script>
        const fetchBtn = document.getElementById('fetchBtn');
        const videoUrlInput = document.getElementById('videoUrl');
        const statusText = document.getElementById('statusText');
        const resultCard = document.getElementById('resultCard');
        const videoTitle = document.getElementById('videoTitle');
        const downloadLink = document.getElementById('downloadLink');

        fetchBtn.addEventListener('click', async () => {
            const url = videoUrlInput.value.trim();
            if(!url) {
                alert("Pehle YouTube link toh daalo bhai!");
                return;
            }

            // Reset UI
            statusText.style.display = "block";
            resultCard.style.display = "none";
            statusText.innerText = "Processing your video... Please wait...";

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ videoUrl: url })
                });

                const data = await response.json();

                if (response.ok && data.downloadLink) {
                    statusText.style.display = "none";
                    resultCard.style.display = "block";
                    videoTitle.innerText = data.title;
                    downloadLink.href = data.downloadLink;
                } else {
                    statusText.innerText = data.error || "Kuch galti hui, link sahi se copy karo.";
                }

            } catch (err) {
                statusText.innerText = "Backend se connection toot gaya.";
            }
        });
    </script>
</body>
</html>
